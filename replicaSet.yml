apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: nginx-replicasets
  namespace: nginx
spec:
  replicas: 2
  selector:

    matchLabels:
      app: nginx
# pod.yml yha pr likhi hai
  template:
    metadata:
      name: nginx-replicaset-po
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
